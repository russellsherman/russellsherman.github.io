name: Build and deploy

# GitHub Pages used to build this repo with its built-in Jekyll pipeline. That
# pipeline cannot build an Astro site, so deploys now happen from here instead.
#
# One-time setup required in the repo before this works:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# Leaving it on "Deploy from a branch" means this workflow uploads an artifact
# that nothing ever publishes.
#
# The neverenough.info custom domain lives in Settings → Pages, NOT in the
# repo. Branch-based publishing used to read the CNAME file out of the
# published branch and set the domain from it; Actions-based publishing does
# not, and switching the source cleared the setting — which is how the domain
# broke once already. public/CNAME still ships in dist/ (harmless, and it
# matters again if this ever moves back to branch publishing) but nothing
# reads it. If the domain 404s with "Site not found", re-enter it in Settings.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; don't cancel one in progress mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

### Action versions
#
# Every action here is on a major that runs on the Node 24 action runtime.
# Anything still on the Node 20 runtime (checkout@v4, setup-node@v4,
# upload-pages-artifact@v3, deploy-pages@v4) logs a deprecation warning on
# every run. This is the *action* runtime — unrelated to .nvmrc, which
# controls the Node the build itself uses.
#
# setup-node@v5 added implicit caching driven by package.json
# `packageManager`; `cache: npm` below is explicit, so that changes nothing
# here. Keep it explicit.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Kept in step with .nvmrc, package.json `engines`, and the
          # devcontainer image. Bump all four together.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      # `npm run build` prints /resume/ to dist/resume.pdf with headless
      # Chromium (scripts/build-resume-pdf.mjs), so the browser has to be here
      # before the build, not just in the lighthouse job below. Only Chromium
      # is installed — playwright ships three engines and the other two are
      # ~200MB of download this never touches.
      - name: Install Chromium (for the resume PDF)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Verify requirements (R1–R5, R7.1, R7.3)
        run: npm run verify

      - name: Upload artifact
        # v4 stopped including dotfiles in the artifact. dist/ has none, and
        # Pages-via-Actions doesn't need a .nojekyll. If that ever changes,
        # this action takes `include-hidden-files: true` as of v5.
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  # R7.2 — Core Web Vitals budgets. Kept separate from the deploy path: a
  # perf regression should be loud and visible without blocking a content
  # fix from shipping. Flip `continue-on-error` to false to make it a gate.
  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run lhci

  deploy:
    # Only publish from main — PRs get the build and the checks, not a deploy.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
